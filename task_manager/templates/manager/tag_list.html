{% extends "base.html" %}

{% block title %}Task Manager - Tags{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="fw-bold text-dark">Tags</h1>
  <a href="{% url 'manager:tag-create' %}" class="btn btn-primary px-4 rounded-pill shadow-sm">
    + Add tag
  </a>
</div>

<div class="card border-0 shadow-sm" style="border-radius: 12px;">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4 py-3">Name</th>
            <th class="text-end pe-4 py-3">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for tag in tags %}
          <tr>
            <td class="ps-4 align-middle">
              <span class="badge bg-secondary-subtle text-secondary rounded-pill px-3 fs-6">
                {{ tag.name }}
              </span>
            </td>
            <td class="text-end pe-4 align-middle">
              <div class="small">
                <a href="{% url 'manager:tag-update' tag.pk %}" class="text-primary text-decoration-none me-3 hover-underline">
                  Update
                </a>
                <a href="{% url 'manager:tag-delete' tag.pk %}" class="text-danger text-decoration-none hover-underline">
                  Delete
                </a>
              </div>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="2" class="text-center py-5 text-muted">
              No tags found. Create one to organize your tasks!
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
