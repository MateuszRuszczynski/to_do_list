<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f4f7f6; }
      .sidebar {
        min-height: 100vh;
        background-color: #ffffff;
        border-right: 1px solid #dee2e6;
        box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      }
      .nav-link { color: #444; border-radius: 8px; margin: 5px 10px; transition: 0.3s; }
      .nav-link:hover { background-color: #f0f2f5; color: #0d6efd; }
      .main-content { padding-top: 2rem; }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar">
          <div class="position-sticky pt-3">
            <h5 class="px-4 mb-4 fw-bold">Menu</h5>
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'manager:index' %}">🏠 Home page</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="">🏷️ Tags</a>
              </li>
            </ul>
          </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
  </body>
</html>
